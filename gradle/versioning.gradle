// Resolve once, before any task captures project.version. No Python is needed
// for local builds, including builds from a source ZIP or without Git installed.
def parseVersion = { String value ->
    if (value == null || value.length() > 128) return null
    def match = value =~ /^[vV]?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/
    if (!match.matches()) return null
    def pre = match[0][4] ?: ''
    if (pre && pre.split(/\./).any { it ==~ /0[0-9]+/ }) return null
    def numbers = [match[0][1], match[0][2], match[0][3] ?: '0']
    def base = numbers.join('.')
    def metadata = match[0][5] ?: ''
    [numbers: numbers.collect { new BigInteger(it) }, pre: pre, base: base,
     canonical: base + (pre ? '-' + pre : '') + (metadata ? '+' + metadata : '')]
}
def compareVersions = { a, b ->
    for (int i = 0; i < 3; i++) {
        int comparison = a.numbers[i] <=> b.numbers[i]
        if (comparison) return comparison
    }
    if (!a.pre || !b.pre) return (!a.pre ? 1 : 0) <=> (!b.pre ? 1 : 0)
    def left = a.pre.split(/\./), right = b.pre.split(/\./)
    for (int i = 0; i < Math.min(left.length, right.length); i++) {
        def x = left[i], y = right[i]
        boolean xn = x ==~ /[0-9]+/, yn = y ==~ /[0-9]+/
        int comparison = xn && yn ? new BigInteger(x) <=> new BigInteger(y)
                : xn != yn ? (xn ? -1 : 1) : x <=> y
        if (comparison) return comparison
    }
    left.length <=> right.length
}
def git = { List<String> arguments ->
    try {
        def output = providers.exec {
            workingDir rootDir
            commandLine(['git'] + arguments)
            ignoreExitValue = true
        }
        output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
    } catch (org.gradle.api.GradleException ignored) {
        null
    }
}
def explicit = providers.gradleProperty('releaseVersion')
if (explicit.isPresent()) {
    def parsed = parseVersion(explicit.get())
    if (parsed == null) throw new GradleException('Invalid releaseVersion: use a semantic version such as 1.3.1 or 1.4.0-rc.1')
    version = parsed.canonical
} else {
    def top = git(['rev-parse', '--show-toplevel'])
    def hash = top != null && new File(top).canonicalFile == rootDir.canonicalFile
            ? git(['rev-parse', '--short=12', 'HEAD']) : null
    if (hash == null) {
        version = '0.0.0-dev'
    } else {
        boolean dirty = git(['status', '--porcelain', '--untracked-files=no']) != ''
        def exactTags = (git(['tag', '--points-at', 'HEAD']) ?: '').readLines()
                .collect { parseVersion(it) }.findAll { it != null }
                .sort { a, b -> compareVersions(a, b) ?: a.canonical <=> b.canonical }
        def exact = exactTags ? exactTags.last() : null
        def base = exact
        String distance = '0'
        if (base == null) {
            def tags = (git(['tag', '--merged', 'HEAD']) ?: '').readLines().findAll { parseVersion(it) != null }
            if (tags) {
                def description = git(['describe', '--tags', '--long', '--abbrev=12']
                        + tags.collectMany { ['--match', it] } + ['HEAD'])
                def match = description == null ? null : description =~ /^(.*)-([0-9]+)-g[0-9a-f]+$/
                if (match != null && match.matches()) {
                    // describe chooses a commit; several release tags can name
                    // that commit. Use its highest version consistently.
                    base = (git(['tag', '--points-at', match[0][1]]) ?: '').readLines()
                            .collect { parseVersion(it) }.findAll { it != null }
                            .sort { a, b -> compareVersions(a, b) ?: a.canonical <=> b.canonical }.last()
                    distance = match[0][2]
                }
            }
        }
        if (exact != null && !dirty) {
            version = exact.canonical
        } else {
            String stem = base == null ? '0.0.0' : base.base
            String pre = base != null && base.pre ? base.pre + '.' : ''
            String count = base == null ? '' : distance + '.'
            version = "${stem}-${pre}dev.${count}g${hash}" + (dirty ? '.dirty' : '')
        }
    }
}
