name: Build release and update S3 version manifest

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and publish release JARs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          version_args=()
          release_version=""
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            release_version="$(python3 scripts/check-release-version.py "$RELEASE_TAG")"
            version_args+=("-PreleaseVersion=$release_version")
          fi
          version="$(./gradlew -q printVersion "${version_args[@]}")"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'release_version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Check release tag matches the built version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/check-release-version.py "$RELEASE_TAG" "$BUILD_VERSION"

      - name: Build and test
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        shell: bash
        run: |
          build_args=(
            :clean :core:clean :cli:clean
            :test :core:test :cli:test
            :shadowJar :cli:shadowJar :writeVersionManifest --no-daemon
          )
          if [ -n "$RELEASE_VERSION" ]; then
            build_args+=("-PreleaseVersion=$RELEASE_VERSION")
          fi
          if [ -n "$UPDATE_MANIFEST_URL" ]; then
            build_args+=("-PupdateManifestUrl=$UPDATE_MANIFEST_URL")
          fi
          ./gradlew "${build_args[@]}"

      - name: Verify packaged versions
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 scripts/check-release-version.py "${RELEASE_TAG:-$BUILD_VERSION}" "$BUILD_VERSION"
          --jar build/libs/bypassfuzzer.jar --cli-jar cli/build/libs/bypassfuzzer-cli.jar --manifest build/release/bypassfuzzer_version.txt

      - name: Upload JARs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/libs/bypassfuzzer.jar cli/build/libs/bypassfuzzer-cli.jar --clobber

      - name: Preserve generated version manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-version-manifest
          path: build/release/bypassfuzzer_version.txt
          if-no-files-found: error

  publish-manifest:
    name: Publish S3 version manifest
    needs: build-and-upload
    runs-on: ubuntu-latest
    concurrency:
      group: bypassfuzzer-stable-version-manifest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      S3_VERSION_MANIFEST_URI: s3://wapen-tools-1/bypassfuzzer_version.txt
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      BUILD_VERSION: ${{ needs.build-and-upload.outputs.version }}
    steps:
      - name: Check manifest publishing configuration
        id: manifest_config
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != release ] || [ "$GITHUB_REPOSITORY" != intrudir/BypassFuzzer-Burp ]; then
            echo "Stable S3 manifest is only published by intrudir/BypassFuzzer-Burp release events."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = true ] || [[ "${BUILD_VERSION%%+*}" == *-* ]]; then
            echo "Skipping stable version manifest for a prerelease."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$AWS_REGION" ] || [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::warning::S3 version publishing needs AWS_REGION and AWS_ROLE_TO_ASSUME secrets."
            echo "S3 version manifest was not updated: configure AWS_REGION and AWS_ROLE_TO_ASSUME." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out publishing scripts
        if: steps.manifest_config.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download generated version manifest
        if: steps.manifest_config.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-version-manifest
          path: build/release

      - name: Configure AWS credentials
        if: steps.manifest_config.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update S3 version manifest
        if: steps.manifest_config.outputs.publish == 'true'
        shell: bash
        run: >-
          python3 scripts/publish-version-manifest.py build/release/bypassfuzzer_version.txt
          "$S3_VERSION_MANIFEST_URI" "$BUILD_VERSION"
